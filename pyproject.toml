[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-test-agent"
version = "0.1.0"
description = "LLM-assisted API testing agent for QA automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "typer>=0.12", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.scripts]
api-agent = "api_test_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/api_test_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
